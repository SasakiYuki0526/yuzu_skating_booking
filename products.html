<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品與交易紀錄管理系統</title>
    <link rel="stylesheet" href="products.css">
</head>

<body>

    <div class="products-layout">
        <!-- 頂部導覽列 -->
        <header class="products-header">
            <h2>📦 商品與交易紀錄管理</h2>
            <button id="back-to-admin-btn" class="back-btn">⬅️ 返回預約管理頁面</button>
        </header>

        <div class="main-grid">
            <!-- 左側：商品管理區 -->
            <section class="card">
                <h3 id="prod-form-title">🛍️ 新增商品</h3>
                <form id="add-product-form" class="form-stack">
                    <input type="hidden" id="edit-prod-id" value="">
                    <div class="form-group">
                        <label>商品名稱：</label>
                        <input type="text" id="prod-name" placeholder="例如：專業滑冰手套" required>
                    </div>
                    <!-- 💡 新增：分類標籤輸入框（支援datalist快速選取或自行輸入新標籤） -->
                    <div class="form-group">
                        <label>分類標籤 (選填)：</label>
                        <input type="text" id="prod-tag" list="tag-suggestions" placeholder="">
                        <datalist id="tag-suggestions">
                            <option value="皮鞋">
                            <option value="冰刀">
                            <option value="護具配件">
                            <option value="服務">
                            <option value="其他週邊">
                        </datalist>
                    </div>
                    <div class="form-group">
                        <label>商品備註 (選填)：</label>
                        <input type="text" id="prod-note" placeholder="例如：尺寸 S/M/L、預購約 7 天">
                    </div>
                    <div class="form-group">
                        <label>選擇商品圖片 (選填)：</label>
                        <input type="file" id="prod-image-file" accept="image/*" style="padding: 6px;">
                    </div>
                    <div class="form-group">
                        <label>教練價格 (NT$)：</label>
                        <input type="number" id="prod-coach-price" placeholder="0" required>
                    </div>
                    <div class="form-group">
                        <label>售價 (NT$)：</label>
                        <input type="number" id="prod-sell-price" placeholder="0" required>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button type="submit" id="prod-submit-btn" class="submit-btn" style="flex: 1;">新增商品</button>
                        <button type="button" id="prod-cancel-edit-btn" class="submit-btn hidden"
                            style="background: #cbd5e0; color: #2d3748; flex: 1;">取消編輯</button>
                    </div>
                </form>

                <hr class="panel-divider">

                <!-- 💡 修改：標題列加上標籤篩選下拉選單 -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h4 style="margin: 0;">現有商品列表</h4>
                    <select id="filter-tag-select"
                        style="padding: 4px 8px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.82rem;">
                        <option value="ALL">全部標籤</option>
                    </select>
                </div>
                <div id="product-list-container" class="product-list-vertical">
                    <!-- 動態載入條列式商品 -->
                </div>
            </section>

            <!-- 右側：交易紀錄管理區 -->
            <section class="card">
                <h3>💰 交易紀錄管理</h3>
                <form id="add-transaction-form" class="form-stack">
                    <div class="form-group">
                        <label>購買人姓名：</label>
                        <input type="text" id="trans-buyer-name" placeholder="例如：王小明" required>
                    </div>

                    <div class="form-group">
                        <label>選擇商品與數量：</label>
                        <div style="display: flex; gap: 8px;">
                            <select id="trans-product-select" style="flex: 2;">
                                <option value="">-- 請選擇商品 --</option>
                            </select>
                            <input type="number" id="trans-item-qty" value="1" min="1" style="width: 70px;"
                                placeholder="數量">
                            <button type="button" id="add-trans-item-btn" class="submit-btn"
                                style="width: auto; margin-top: 0; background-color: #3182ce;">加入</button>
                        </div>
                    </div>

                    <!-- 本次交易已選商品清單 -->
                    <div class="form-group">
                        <label>本次交易清單：</label>
                        <div id="current-trans-items" class="current-items-box">
                            <span style="color: #a0aec0; font-size: 0.85rem; padding: 4px;">尚未加入商品</span>
                        </div>
                    </div>

                    <!-- 💡 新增：備註輸入框 -->
                    <div class="form-group">
                        <label>備註 (選填)：</label>
                        <input type="text" id="trans-note" placeholder="例如：已匯款、7-11店到店等">
                    </div>

                    <!-- 即時試算本次交易總金額 -->
                    <div class="live-calc-box">
                        <span>本次交易合計：</span>
                        <span>總售價 <strong id="calc-sell-total" style="color: #2b6cb0;">$0</strong> ｜ 總教練價 <strong
                                id="calc-coach-total" style="color: #38a169;">$0</strong></span>
                    </div>

                    <button type="submit" class="submit-btn" style="background-color: #38a169;">送出交易紀錄</button>
                </form>

                <hr class="panel-divider">

                <h4>交易紀錄明細</h4>
                <div class="table-responsive">
                    <table class="transaction-table">
                        <thead>
                            <tr>
                                <th>日期</th>
                                <th>購買人</th>
                                <th>購買商品明細</th>
                                <th>總售價</th>
                                <th>總教練價</th>
                                <th>備註</th> <!-- 💡 新增欄位 -->
                                <th>已收款</th>
                                <th>已付廠商</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="transaction-table-body">
                            <!-- 動態載入交易紀錄 -->
                        </tbody>
                        <tfoot id="transaction-table-foot">
                            <!-- 動態載入總加總列 -->
                        </tfoot>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="products.js"></script>
</body>

</html>
