<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約時段管理系統</title>

    <!-- FullCalendar CSS -->
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/main.min.css" rel="stylesheet">
    <!-- 專案自訂樣式 -->
    <link rel="stylesheet" href="style.css">

    <!-- FullCalendar JS -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
</head>

<body>

    <div class="booking-layout">
        <!-- 左側：月曆與管理者面板區塊 -->
        <aside class="calendar-sidebar">
            <div class="sidebar-header">
                <h2>預約行事曆</h2>
                <button id="admin-toggle-btn" class="admin-btn">🔒 管理員登入</button>
            </div>

            <!-- 管理者專用面板 (預設隱藏) -->
            <div id="admin-panel" class="admin-panel hidden">
                <h3>新增時段設定</h3>
                <form id="add-slot-form">
                    <div class="form-group">
                        <label>起始日期：</label>
                        <input type="date" id="input-date" required>
                    </div>

                    <!-- 時間區間選擇器 (固定 40 分鐘，結束時間唯讀) -->
                    <!-- 時間區間選擇器 (以 10 分鐘為單位，可自由設定起訖) -->
                    <div class="form-group">
                        <label>總時間區間 (自動每 40 分鐘切片)：</label>
                        <div style="display: flex; align-items: center; gap: 6px;">
                            <input type="time" id="input-start-time" step="600" required style="width: 45%;">
                            <span>至</span>
                            <input type="time" id="input-end-time" step="600" required style="width: 45%;">
                        </div>
                    </div>

                    <button type="submit" class="submit-btn">新增單一時段</button>
                </form>

                <hr class="panel-divider">

                <!-- ⚡ 每週反覆新增區塊 -->
                <h3>⚡ 每週反覆新增此時段</h3>
                <p class="batch-desc">依上方設定的日期與時間，自動每週重複寫入：</p>
                <div class="form-group">
                    <label>重複週數：</label>
                    <select id="repeat-weeks">
                        <option value="4">未來 4 週 (約 1 個月)</option>
                        <option value="8">未來 8 週 (約 2 個月)</option>
                        <option value="12">未來 12 週 (約 3 個月)</option>
                    </select>
                </div>
                <button type="button" id="batch-repeat-weekly-btn" class="batch-btn">一鍵每週反覆新增</button>

                <hr class="panel-divider">

                <!-- 🔒 全包場設定區塊 -->
                <h3>🔒 指定全天包場</h3>
                <p class="batch-desc">將上方的「起始日期」直接設定為全天包場：</p>
                <button type="button" id="set-full-booking-btn" class="batch-btn"
                    style="background-color: #e53e3e;">設定為全天包場</button>
            </div>

            <!-- FullCalendar 迷你月曆 -->
            <div id="mini-calendar"></div>

            <!-- 月曆圖例說明 -->
            <div class="calendar-legend">
                <div class="legend-item">
                    <span class="dot-available"></span>
                    <span>可預約</span>
                </div>
                <div class="legend-item">
                    <span class="dot-booked"></span>
                    <span>已額滿</span>
                </div>
                <div class="legend-item">
                    <span class="dot-full-booked"></span>
                    <span>全天包場</span>
                </div>
            </div>

            <!-- 💡 新增：固定洗冰時間備註 -->
            <div class="ice-cleaning-info">
                <p><strong>洗冰時間：</strong></p>
                <p>• 平日：14:40 - 15:00</p>
                <p>• 假日：13:50 - 14:20 / 16:50 - 17:20</p>
            </div>
        </aside>

        <!-- 右側：選定日期的時段狀況展示區 -->
        <div class="slots-main">
            <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;">
                <h2 id="selected-date-title" style="margin-bottom: 0;">時段狀況</h2>
                <span style="font-size: 0.85rem; color: #718096;">點選時段可直接預約課程</span>
            </div>
            <div id="slots-container" class="slots-grid">
                <!-- 動態時段卡片 -->
            </div>
            <!-- 增加每個月26號更新的備註 -->
            <div style="margin-top: 16px; font-size: 0.8rem; color: #a0aec0; text-align: right;">
                ＊每個月26號會更新下個月可預約時間
            </div>
        </div>
    </div>

    <!-- 💡 一般訪客：預約填寫姓名彈窗 -->
    <div id="booking-modal" class="custom-modal hidden">
        <div class="modal-content">
            <h3>預約時段</h3>
            <p id="modal-slot-info" style="margin: 8px 0; color: #4a5568; font-size: 0.9rem;"></p>
            <form id="booking-form">
                <div class="form-group">
                    <div style="margin-bottom: 12px;">
                        <label for="booking-type"
                            style="display: block; font-size: 0.9rem; margin-bottom: 4px; color: #4a5568;">課程類型：</label>
                        <select id="booking-type"
                            style="width: 100%; padding: 8px; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 0.95rem;">
                            <option value="1v1">1v1</option>
                            <option value="1v2">1v2</option>
                            <option value="1v3">1v3</option>
                        </select>
                    </div>
                    <label>學生姓名：</label>
                    <input type="text" id="booking-student-name" placeholder="請輸入學生姓名" required>
                    <!-- 在輸入姓名的 div 或 input 下方加入這段選單 -->
                    
                </div>
                <div class="modal-actions">
                    <button type="button" id="modal-cancel-btn" class="submit-btn"
                        style="background: #cbd5e0; color: #2d3748;">取消</button>
                    <button type="submit" class="submit-btn">確認預約</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 💡 管理者：檢視預約情形浮動頁面 -->
    <div id="admin-booking-modal" class="custom-modal hidden">
        <div class="modal-content">
            <h3>預約學員名單</h3>
            <p id="admin-modal-slot-info" style="margin: 8px 0; color: #4a5568; font-size: 0.9rem;"></p>
            <div id="admin-booking-list" style="margin: 12px 0; max-height: 200px; overflow-y: auto;">
                <!-- 動態載入預約名單與勾選確認框 -->
            </div>
            <div class="modal-actions">
                <button type="button" id="admin-modal-close-btn" class="submit-btn">關閉</button>
            </div>
        </div>
    </div>

    <!-- 載入主要邏輯 JS -->
    <script type="module" src="app.js"></script>
</body>

</html>
